<style>
:root{
  --bg:#f2f4f9;--card:#ffffff;--card-2:#f8fafc;--ink:#141d2e;--muted:#64708a;--line:#e2e7f0;
  --brand:#0b6b45;--brand-600:#095a3a;--brand-2:#14a06b;--accent:#0ea5a4;--gold:#f5b700;
  --danger:#dc2626;--danger-bg:#fdecec;--ok:#15803d;--ok-bg:#e7f6ec;--info-bg:#e8f1ff;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1017;--card:#141b27;--card-2:#192232;--ink:#e8edf6;--muted:#97a3b9;--line:#263248;
    --brand:#16a36f;--brand-600:#14905f;--brand-2:#22c58b;--accent:#2dd4bf;--gold:#fbbf24;
    --danger:#f87171;--danger-bg:#3a1c1c;--ok:#4ade80;--ok-bg:#15301f;--info-bg:#1b2a44;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3{letter-spacing:-.01em}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:.85rem;margin:0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
.topbar-inner{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-box{background:#fff;border-radius:14px;padding:8px 14px;display:flex;align-items:center;flex-shrink:0;box-shadow:0 1px 3px rgba(15,23,42,.12)}
.logo-box img{height:64px;width:auto;display:block}
.brand-text b{display:block;font-size:1.02rem}
.brand-text span{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.role{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--card-2)}
.role.admin{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent);background:color-mix(in srgb,var(--brand) 10%,transparent)}

/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 70%,var(--accent) 100%);color:#fff;padding:28px 20px 96px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;left:-70px;bottom:-140px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero-inner{max-width:1280px;margin:0 auto;position:relative;z-index:1}
.hero h1{margin:0 0 4px;font-size:1.6rem}
.hero p{margin:0;opacity:.92}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:600}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:-70px auto 0;padding:0 20px 40px;position:relative;z-index:2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .num{font-size:1.85rem;font-weight:800;line-height:1.1;margin-top:6px}
.stat .lbl{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stat .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--brand-2),var(--accent))}
.stat .bar{height:5px;border-radius:5px;background:var(--line);margin-top:12px;overflow:hidden}
.stat .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--accent));transition:width .4s}
.layout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
@media (max-width:560px){.logo-box img{height:48px}.logo-box{padding:6px 10px}.brand-text{display:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-title{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:1.05rem}
.panel-title small{margin-left:auto;color:var(--muted);font-weight:600;font-size:.82rem}
.panel h3{margin:0 0 10px;font-size:.98rem}
.sep{height:1px;background:var(--line);margin:16px 0}

/* ---------- forms ---------- */
.field{display:grid;gap:4px;min-width:0}
.lab{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;font:inherit;color:inherit;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.btns{display:grid;gap:8px}

/* ---------- buttons ---------- */
.btn{font:inherit;font-weight:700;font-size:.92rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.icon-btn:focus-visible,.tab:focus-visible,.dept-pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-danger{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
.btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sm{padding:6px 10px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.full{width:100%}
.icon-btn{border:none;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1rem;display:grid;place-items:center}
.icon-btn:hover{background:var(--card-2);color:var(--ink)}
.role-btn{font-size:.85rem}

/* ---------- departments sidebar ---------- */
.dept-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;max-height:460px;overflow:auto;padding-right:2px}
.dept-item{border:1px solid var(--line);border-radius:12px;background:var(--card-2);transition:border-color .15s,background .15s}
.dept-item:hover{border-color:var(--accent)}
.dept-item.active{border-color:var(--accent);background:var(--card);box-shadow:inset 4px 0 0 var(--accent)}
.dept-pick{display:block;width:100%;text-align:start;background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:10px 12px}
.dept-pick b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dept-pick small{color:var(--muted);font-size:.8rem}
.danger-zone{margin-top:16px;border:1px dashed color-mix(in srgb,var(--danger) 40%,transparent);border-radius:12px;padding:12px;background:var(--danger-bg)}
.danger-zone h3{color:var(--danger);margin:0 0 4px;font-size:.92rem}
.danger-zone .btn{margin-top:8px}

/* ---------- main ---------- */
.dept-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.dept-head h2{margin:0;font-size:1.4rem;min-width:0;overflow-wrap:anywhere}
.dept-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0 16px}
.kpi{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi-v{font-size:1.35rem;font-weight:800}
.kpi-l{font-size:.78rem;color:var(--muted);font-weight:600}
.kpi-s{font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;background:var(--card-2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tab{flex:1;min-width:110px;font:inherit;font-weight:700;border:none;background:none;color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow-sm)}
.count{font-size:.72rem;background:var(--line);color:var(--muted);border-radius:999px;padding:1px 7px}
.tab.on .count{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.form-box{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;background:var(--card-2)}
.form-box.editing{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--card))}
.form-box h3{display:flex;align-items:center;gap:8px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.toolbar .input{max-width:320px}
.toolbar .note{margin-left:auto}

/* ---------- tables ---------- */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--card-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--card-2)}
tr.editing td{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);font-size:.8rem;font-weight:600}
.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--brand) 15%,transparent);color:var(--brand);font-weight:800;font-size:.75rem;margin-right:8px;vertical-align:middle}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:2.2rem;margin-bottom:6px}
.empty h3{color:var(--ink);font-size:1.1rem;margin:0 0 6px}
.limit{background:var(--gold);color:#1f2937;border-radius:10px;padding:10px 12px;font-weight:700;font-size:.9rem}

/* ---------- overview ---------- */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.two-col{grid-template-columns:1fr}}
.card-soft{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card-2)}
.bar-row{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.bar-track{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--brand-2),var(--accent));border-radius:8px}
.quick{display:grid;gap:8px}

/* ---------- dialog ---------- */
dialog{border:none;border-radius:18px;padding:0;width:min(440px,92vw);background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,15,25,.55);backdrop-filter:blur(3px)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0;font-size:1.05rem}
.dlg-body{padding:18px 20px;display:grid;gap:14px}
.dlg-body p{margin:0}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);transition:transform .3s ease;font-weight:600;z-index:50;max-width:90vw;display:flex;align-items:center;gap:10px}
.toast.show{transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{background:var(--ok);color:#fff}

footer{max-width:1280px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer b{color:var(--ink)}
</style>
</head>

<script>
(() => {
"use strict";

const KEY = "ulms.v1";          // same key as the first version, so existing data is kept
const ADMIN_KEY = "ulms.adminHash";
const SESSION_KEY = "ulms.isAdmin";
const LIMIT = 10;               // same limits as the C++ console version
const $ = (sel) => document.querySelector(sel);

/* ---------- storage ---------- */
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (d && Array.isArray(d.departments)) return d;
  } catch (_) { /* corrupt data: start fresh */ }
  return { departments: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (_) { toast("Could not save data in this browser.", "err"); }
}
function readSession() {
  try { return sessionStorage.getItem(SESSION_KEY) === "1"; } catch (_) { return false; }
}
function writeSession(on) {
  try { on ? sessionStorage.setItem(SESSION_KEY, "1") : sessionStorage.removeItem(SESSION_KEY); } catch (_) { /* ignore */ }
}

let db = load();
const ui = {
  admin: readSession(),
  deptId: null, deptQ: "",
  tab: "overview", q: "", sort: { key: null, dir: 1 }, editId: null,
};

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
const cleanName = (s) => String(s || "").trim().replace(/\s+/g, " ");
const toInt = (v) => (/^\s*\d+\s*$/.test(String(v)) ? parseInt(v, 10) : NaN);
const currentDept = () => db.departments.find((d) => d.id === ui.deptId) || null;
const avg = (arr, key) => (arr.length ? arr.reduce((n, x) => n + Number(x[key]), 0) / arr.length : null);
const initials = (name) => String(name).split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
const SINGULAR = { teachers: "teacher", students: "student", courses: "course" };
const TAB_LABEL = { overview: "Overview", teachers: "Teachers", students: "Students", courses: "Courses" };

// Builds DOM nodes. Text always goes through textContent, so nothing is injected as HTML.
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "class") n.className = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}

function fieldEl({ name, label, type = "text", placeholder = "", value = null, extra = {} }) {
  const input = h("input", Object.assign({
    class: "input", name, type, placeholder, required: true, autocomplete: "off",
    value: value === null ? null : String(value),
  }, extra));
  return h("div", { class: "field" }, h("span", { class: "lab" }, label), input);
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, type = "") {
  const t = $("#toast");
  t.replaceChildren(h("span", null, msg));
  t.className = "toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast"; }, 2800);
}

/* ---------- dialog (replaces browser prompts) ---------- */
// Resolves to the onSubmit result (or true), or null if cancelled.
function dialog({ title, body, okText = "OK", cancelText = "Cancel", danger = false, onSubmit }) {
  return new Promise((resolve) => {
    const dlg = $("#dlg");
    let settled = false;
    const finish = (value) => {
      if (settled) return;
      settled = true;
      resolve(value);
      if (dlg.open) dlg.close();
    };
    dlg.replaceChildren(
      h("div", { class: "dlg-head" },
        h("h3", { id: "dlgTitle" }, title),
        h("button", { class: "icon-btn", type: "button", "aria-label": "Close", onclick: () => finish(null) }, "✕")),
      h("form", {
        class: "dlg-body", method: "dialog",
        onsubmit: (e) => {
          e.preventDefault();
          Promise.resolve(onSubmit ? onSubmit(e.target) : true).then((r) => {
            if (r !== false) finish(r === undefined ? true : r);
          });
        },
      },
        body,
        h("div", { class: "dlg-actions" },
          h("button", { class: "btn", type: "button", onclick: () => finish(null) }, cancelText),
          h("button", { class: "btn " + (danger ? "btn-danger-solid" : "btn-primary"), type: "submit" }, okText))));
    dlg.addEventListener("close", () => finish(null), { once: true });
    dlg.showModal();
    const first = dlg.querySelector("input");
    if (first) first.focus();
  });
}

/* ---------- admin ---------- */
async function hashPw(pw) {
  const salted = "ulms-salt|" + pw;
  if (window.crypto && crypto.subtle) {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salted));
      return "sha256:" + [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch (_) { /* fall through */ }
  }
  let x = 5381;
  for (const ch of salted) x = ((x << 5) + x + ch.charCodeAt(0)) | 0;
  return "djb2:" + (x >>> 0).toString(16);
}

function setAdmin(on) {
  ui.admin = on;
  writeSession(on);
  render();
}

function requireAdmin() {
  if (ui.admin) return true;
  toast("Only the admin can do this. Click “Admin login” first.", "err");
  return false;
}

function adminLogin() {
  if (ui.admin) {
    dialog({
      title: "Log out of admin?",
      body: h("p", { class: "muted" }, "You will still be able to view, add and edit records, but not delete them."),
      okText: "Log out",
    }).then((ok) => { if (ok) { setAdmin(false); toast("Logged out of admin."); } });
    return;
  }
  const stored = localStorage.getItem(ADMIN_KEY);
  if (!stored) {
    dialog({
      title: "Create admin password",
      body: [
        h("p", { class: "muted" }, "No admin password exists yet. Create one to unlock admin tools (delete, rename, clear all)."),
        fieldEl({ name: "pw", label: "New password", type: "password", placeholder: "At least 6 characters", extra: { minlength: "6" } }),
        fieldEl({ name: "pw2", label: "Confirm password", type: "password", placeholder: "Repeat the password" }),
      ],
      okText: "Create & log in",
      onSubmit: async (form) => {
        const a = form.elements.pw.value, b = form.elements.pw2.value;
        if (a.length < 6) { toast("Password must be at least 6 characters.", "err"); return false; }
        if (a !== b) { toast("Passwords do not match.", "err"); return false; }
        localStorage.setItem(ADMIN_KEY, await hashPw(a));
        setAdmin(true);
        toast("Admin password created. You are now logged in.", "ok");
      },
    });
    return;
  }
  dialog({
    title: "Admin login",
    body: [fieldEl({ name: "pw", label: "Admin password", type: "password", placeholder: "Enter admin password" })],
    okText: "Log in",
    onSubmit: async (form) => {
      const ok = (await hashPw(form.elements.pw.value)) === localStorage.getItem(ADMIN_KEY);
      if (!ok) { toast("Wrong password. Please try again.", "err"); return false; }
      setAdmin(true);
      toast("Welcome, admin.", "ok");
    },
  });
}

/* ---------- table columns & form definitions ---------- */
const COLS = {
  teachers: [
    { label: "Name", key: "name", avatar: true },
    { label: "Age", key: "age", num: true },
    { label: "Degree", key: "degree" },
    { label: "Experience", key: "experience", num: true, cell: (x) => h("span", { class: "pill" }, `${x.experience} yrs`) },
  ],
  students: [
    { label: "Student ID", key: "studentID", num: true },
    { label: "Name", key: "name", avatar: true },
    { label: "Age", key: "age", num: true },
  ],
  courses: [
    { label: "Code", key: "code", num: true },
    { label: "Course name", key: "name" },
  ],
};

const FORMS = {
  teachers: {
    title: "Add a teacher",
    fields: [
      { name: "name", label: "Full name", placeholder: "e.g. Muhammad Hamza" },
      { name: "age", label: "Age", type: "number", placeholder: "e.g. 38", extra: { min: 1, max: 120 } },
      { name: "degree", label: "Degree", placeholder: "e.g. PhD in Physics" },
      { name: "experience", label: "Years of experience", type: "number", placeholder: "e.g. 6", extra: { min: 0, max: 60 } },
    ],
    submit: addTeacher,
  },
  students: {
    title: "Add a student",
    fields: [
      { name: "name", label: "Full name", placeholder: "e.g. Muhammad Hamza" },
      { name: "age", label: "Age", type: "number", placeholder: "e.g. 20", extra: { min: 1, max: 120 } },
      { name: "studentID", label: "Student ID", type: "number", placeholder: "e.g. 2024101", extra: { min: 1 } },
    ],
    submit: addStudent,
  },
  courses: {
    title: "Add a course",
    fields: [
      { name: "name", label: "Course name", placeholder: "e.g. Data Structures" },
      { name: "code", label: "Course code", type: "number", placeholder: "e.g. 201", extra: { min: 1 } },
    ],
    submit: addCourse,
  },
};

/* ---------- actions ---------- */
function done(msg) {
  ui.editId = null;
  save();
  render();
  if (msg) toast(msg, "ok");
}

// Adds a new entry, or replaces the entry with editId.
function saveItem(d, kind, obj, editId) {
  if (editId) {
    const i = d[kind].findIndex((x) => x.id === editId);
    if (i >= 0) d[kind][i] = { id: editId, ...obj };
  } else {
    d[kind].push({ id: uid(), ...obj });
  }
}

function addDepartment(raw) {
  const name = cleanName(raw);
  if (!name) return toast("Please enter a department name.", "err");
  if (name.length > 80) return toast("Department name is too long (max 80 characters).", "err");
  if (db.departments.length >= LIMIT) return toast("Limit reached: a university can hold 10 departments.", "err");
  if (db.departments.some((x) => x.name.toLowerCase() === name.toLowerCase()))
    return toast("This department already exists.", "err");
  const d = { id: uid(), name, teachers: [], students: [], courses: [] };
  db.departments.push(d);
  ui.deptId = d.id; ui.tab = "overview"; ui.q = ""; ui.sort = { key: null, dir: 1 };
  done("Department added.");
}

function renameDept(id) {
  if (!requireAdmin()) return;
  const d = db.departments.find((x) => x.id === id);
  if (!d) return;
  dialog({
    title: "Rename department",
    body: [fieldEl({ name: "dname", label: "Department name", value: d.name, extra: { maxlength: "80" } })],
    okText: "Save",
    onSubmit: (form) => {
      const name = cleanName(form.elements.dname.value);
      if (!name) { toast("Please enter a name.", "err"); return false; }
      if (db.departments.some((x) => x.id !== id && x.name.toLowerCase() === name.toLowerCase())) {
        toast("Another department already has this name.", "err");
        return false;
      }
      d.name = name;
      done("Department renamed.");
    },
  });
}

function deleteDepartment(id) {
  if (!requireAdmin()) return;
  const d = db.departments.find((x) => x.id === id);
  if (!d) return;
  dialog({
    title: "Delete department?",
    body: h("p", { class: "muted" }, `"${d.name}" and all its teachers, students and courses will be permanently removed.`),
    okText: "Delete department",
    danger: true,
  }).then((ok) => {
    if (!ok) return;
    db.departments = db.departments.filter((x) => x.id !== id);
    if (ui.deptId === id) ui.deptId = null;
    done("Department deleted.");
  });
}

function addTeacher(d, r, editId) {
  const name = cleanName(r.name), degree = cleanName(r.degree);
  const age = toInt(r.age), exp = toInt(r.experience);
  if (!name) return toast("Please enter the teacher's name.", "err");
  if (!(age >= 1 && age <= 120)) return toast("Age must be a whole number from 1 to 120.", "err");
  if (!degree) return toast("Please enter the degree.", "err");
  if (!(exp >= 0 && exp <= 60)) return toast("Experience must be a whole number from 0 to 60.", "err");
  saveItem(d, "teachers", { name, age, degree, experience: exp }, editId);
  done(editId ? "Teacher updated." : "Teacher added.");
}

function addStudent(d, r, editId) {
  const name = cleanName(r.name);
  const age = toInt(r.age), sid = toInt(r.studentID);
  if (!name) return toast("Please enter the student's name.", "err");
  if (!(age >= 1 && age <= 120)) return toast("Age must be a whole number from 1 to 120.", "err");
  if (!(sid >= 1)) return toast("Student ID must be a positive whole number.", "err");
  if (d.students.some((s) => s.studentID === sid && s.id !== editId))
    return toast("This student ID already exists in this department.", "err");
  saveItem(d, "students", { name, age, studentID: sid }, editId);
  done(editId ? "Student updated." : "Student added.");
}

function addCourse(d, r, editId) {
  const name = cleanName(r.name), code = toInt(r.code);
  if (!name) return toast("Please enter the course name.", "err");
  if (!(code >= 1)) return toast("Course code must be a positive whole number.", "err");
  saveItem(d, "courses", { name, code }, editId);
  done(editId ? "Course updated." : "Course added.");
}

function removeItem(kind, id) {
  if (!requireAdmin()) return;
  const d = currentDept();
  const item = d && d[kind].find((x) => x.id === id);
  if (!item) return;
  const label = item.name || String(item.studentID);
  dialog({
    title: "Delete entry?",
    body: h("p", { class: "muted" }, `"${label}" will be permanently removed.`),
    okText: "Delete",
    danger: true,
  }).then((ok) => {
    if (!ok) return;
    d[kind] = d[kind].filter((x) => x.id !== id);
    if (ui.editId === id) ui.editId = null;
    done("Deleted.");
  });
}

function clearAll() {
  if (!requireAdmin()) return;
  if (!db.departments.length) return toast("There is no data to clear.");
  dialog({
    title: "Clear all data?",
    body: h("p", { class: "muted" }, "This deletes every department, teacher, student and course saved in this browser. This cannot be undone."),
    okText: "Clear everything",
    danger: true,
  }).then((ok) => {
    if (!ok) return;
    db = { departments: [] };
    ui.deptId = null; ui.editId = null;
    done("All data cleared.");
  });
}

function startEdit(id) {
  ui.editId = id;
  renderForm();
  renderList();
  const box = $("#formBox");
  if (box) {
    box.scrollIntoView({ behavior: "smooth", block: "center" });
    const first = box.querySelector("input");
    if (first) first.focus();
  }
}

function selectTab(key) {
  ui.tab = key; ui.q = ""; ui.editId = null; ui.sort = { key: null, dir: 1 };
  render();
}

function toggleSort(key) {
  if (ui.sort.key === key) ui.sort.dir *= -1;
  else { ui.sort.key = key; ui.sort.dir = 1; }
  renderList();
}

/* ---------- rendering ---------- */
function render() {
  renderTop();
  renderStats();
  renderDeptPanel();
  renderMainPanel();
}

function renderTop() {
  const badge = $("#roleBadge");
  badge.textContent = ui.admin ? "Admin" : "Guest";
  badge.className = "role" + (ui.admin ? " admin" : "");
  $("#btnAdmin").textContent = ui.admin ? "Log out of admin" : "Admin login";
}

function renderStats() {
  const dep = db.departments.length;
  const sum = (key) => db.departments.reduce((n, d) => n + d[key].length, 0);
  const cap = Math.max(1, LIMIT * dep);
  const rows = [
    ["Departments", "D", dep, dep / LIMIT],
    ["Teachers", "T", sum("teachers"), sum("teachers") / cap],
    ["Students", "S", sum("students"), sum("students") / cap],
    ["Courses", "C", sum("courses"), sum("courses") / cap],
  ];
  $("#stats").replaceChildren(...rows.map(([label, icon, n, ratio]) =>
    h("div", { class: "stat" },
      h("div", { class: "top" }, h("span", { class: "lbl" }, label), h("span", { class: "dot", "aria-hidden": "true" }, icon)),
      h("div", { class: "num" }, String(n)),
      h("div", { class: "bar" }, h("span", { style: `width:${Math.min(100, Math.round(ratio * 100))}%` })))
  ));
}

function renderDeptPanel() {
  const full = db.departments.length >= LIMIT;
  const input = h("input", { class: "input", name: "dname", placeholder: "e.g. Computer Science", maxlength: "80", required: true, autocomplete: "off", "aria-label": "New department name" });
  const addForm = h("form", { onsubmit: (e) => { e.preventDefault(); addDepartment(input.value); } },
    h("span", { class: "lab" }, "Add department"),
    h("div", { style: "display:grid;gap:8px;margin-top:6px" },
      input,
      h("button", { class: "btn btn-primary full", type: "submit", disabled: full ? true : null },
        full ? "Limit reached (10)" : "+ Add department")));
  const search = h("input", {
    class: "input", type: "search", placeholder: "Find a department...", "aria-label": "Find a department",
    value: ui.deptQ,
    oninput: (e) => { ui.deptQ = e.target.value; renderDeptList(); },
  });

  $("#deptPanel").replaceChildren(
    h("h2", { class: "panel-title" }, "Departments", h("small", null, `${db.departments.length} / ${LIMIT}`)),
    addForm,
    h("div", { class: "sep" }),
    search,
    h("ul", { class: "dept-list", id: "deptList" }),
    ui.admin ? h("div", { class: "danger-zone" },
      h("h3", null, "Admin zone"),
      h("p", { class: "note" }, "Permanently delete all data in this browser."),
      h("button", { class: "btn btn-danger-solid btn-sm full", type: "button", onclick: clearAll }, "Clear all data")) : null);
  renderDeptList();
}

function renderDeptList() {
  const q = ui.deptQ.trim().toLowerCase();
  const shown = db.departments.filter((d) => !q || d.name.toLowerCase().includes(q));
  let content;
  if (db.departments.length === 0) content = h("li", { class: "note" }, "No departments yet. Add one above to begin.");
  else if (shown.length === 0) content = h("li", { class: "note" }, "No department matches your search.");
  else content = shown.map((d) =>
    h("li", { class: "dept-item" + (d.id === ui.deptId ? " active" : "") },
      h("button", {
        class: "dept-pick", type: "button", "aria-current": d.id === ui.deptId ? "true" : null,
        onclick: () => { ui.deptId = d.id; ui.tab = "overview"; ui.q = ""; ui.editId = null; ui.sort = { key: null, dir: 1 }; render(); },
      },
        h("b", null, d.name),
        h("small", null, `${d.teachers.length} teachers · ${d.students.length} students · ${d.courses.length} courses`))));
  $("#deptList").replaceChildren(...[content].flat());
}

function renderMainPanel() {
  const panel = $("#mainPanel");
  const d = currentDept();

  if (!d) {
    panel.replaceChildren(h("div", { class: "empty" },
      h("div", { class: "big" }, "🏛️"),
      h("h3", null, "Select a department"),
      "Add a department on the left, or pick one from the list, to manage its teachers, students and courses."));
    return;
  }

  const counts = { teachers: d.teachers.length, students: d.students.length, courses: d.courses.length };
  const tabs = ["overview", "teachers", "students", "courses"];

  panel.replaceChildren(
    h("div", { class: "dept-head" },
      h("h2", null, d.name),
      h("div", { class: "actions" },
        ui.admin
          ? [h("button", { class: "btn btn-sm", type: "button", onclick: () => renameDept(d.id) }, "Rename"),
             h("button", { class: "btn btn-danger btn-sm", type: "button", onclick: () => deleteDepartment(d.id) }, "Delete department")]
          : h("span", { class: "note" }, "Log in as admin to rename or delete"))),
    h("div", { class: "tabs", role: "tablist" }, tabs.map((key) =>
      h("button", {
        class: "tab" + (ui.tab === key ? " on" : ""), type: "button", role: "tab",
        "aria-selected": ui.tab === key ? "true" : "false",
        onclick: () => selectTab(key),
      }, TAB_LABEL[key], key === "overview" ? null : h("span", { class: "count" }, String(counts[key]))))),
    ui.tab === "overview" ? renderOverview(d) : renderEntries(d));

  if (ui.tab !== "overview") { renderForm(); renderList(); }
}

function renderOverview(d) {
  const tA = avg(d.teachers, "experience");
  const sA = avg(d.students, "age");
  const kpis = [
    ["Teachers", String(d.teachers.length), `of ${LIMIT} max`],
    ["Students", String(d.students.length), `of ${LIMIT} max`],
    ["Courses", String(d.courses.length), `of ${LIMIT} max`],
    ["Avg teacher experience", tA === null ? "–" : tA.toFixed(1) + " yrs", ""],
    ["Avg student age", sA === null ? "–" : sA.toFixed(1), ""],
  ];
  const byDeg = {};
  d.teachers.forEach((t) => { byDeg[t.degree] = (byDeg[t.degree] || 0) + 1; });
  const degrees = Object.entries(byDeg).sort((a, b) => b[1] - a[1]);
  const maxDeg = Math.max(1, ...degrees.map((e) => e[1]));

  return h("div", null,
    h("div", { class: "kpis" }, kpis.map(([label, value, sub]) =>
      h("div", { class: "kpi" },
        h("div", { class: "kpi-v" }, value),
        h("div", { class: "kpi-l" }, label),
        sub ? h("div", { class: "kpi-s" }, sub) : null))),
    h("div", { class: "two-col" },
      h("div", { class: "card-soft" },
        h("h3", null, "Teachers by degree"),
        degrees.length
          ? degrees.map(([deg, n]) => h("div", { class: "bar-row" },
              h("span", null, deg),
              h("div", { class: "bar-track" }, h("div", { class: "bar-fill", style: `width:${Math.round((n / maxDeg) * 100)}%` })),
              h("b", null, String(n))))
          : h("p", { class: "note" }, "No teachers yet.")),
      h("div", { class: "card-soft" },
        h("h3", null, "Quick actions"),
        h("div", { class: "quick" },
          [["teachers", "+ Add a teacher"], ["students", "+ Add a student"], ["courses", "+ Add a course"]].map(([t, label]) =>
            h("button", { class: "btn full", type: "button", onclick: () => selectTab(t) }, label))),
        h("p", { class: "note", style: "margin-top:12px" },
          ui.admin ? "You are logged in as admin: you can delete and rename." : "Anyone can add and edit. Only the admin can delete or rename."))));
}

function renderEntries(d) {
  const search = h("input", {
    class: "input", type: "search", placeholder: `Search ${TAB_LABEL[ui.tab].toLowerCase()}...`,
    "aria-label": "Search this list", value: ui.q,
    oninput: (e) => { ui.q = e.target.value; renderList(); },
  });
  return h("div", null,
    h("div", { class: "form-box", id: "formBox" }),
    h("div", { class: "toolbar" }, search, h("span", { class: "note", id: "listNote" })),
    h("div", { id: "listBox" }));
}

function renderForm() {
  const d = currentDept();
  const box = $("#formBox");
  if (!d || !box) return;
  const cfg = FORMS[ui.tab];
  const editing = ui.editId ? d[ui.tab].find((x) => x.id === ui.editId) : null;
  if (ui.editId && !editing) ui.editId = null;

  if (!editing && d[ui.tab].length >= LIMIT) {
    box.className = "form-box";
    box.replaceChildren(h("div", { class: "limit" }, `Limit reached: a department can hold ${LIMIT} ${ui.tab}.`));
    return;
  }

  const fieldEls = cfg.fields.map((f) => fieldEl(Object.assign({}, f, {
    value: editing ? editing[f.name] : null,
  })));
  const buttons = [h("button", { class: "btn btn-primary full", type: "submit" }, editing ? "Update" : "Save")];
  if (editing) buttons.push(h("button", {
    class: "btn full", type: "button",
    onclick: () => { ui.editId = null; renderForm(); renderList(); },
  }, "Cancel"));

  box.className = "form-box" + (editing ? " editing" : "");
  box.replaceChildren(h("form", {
    onsubmit: (e) => {
      e.preventDefault();
      const raw = {};
      for (const f of cfg.fields) raw[f.name] = e.target.elements[f.name].value;
      cfg.submit(d, raw, editing ? editing.id : null);
    },
  },
    h("h3", null, editing ? `Edit ${SINGULAR[ui.tab]}` : cfg.title),
    h("div", { class: "grid-form" }, fieldEls, h("div", { class: "btns" }, buttons))));
}

function renderList() {
  const d = currentDept();
  const box = $("#listBox");
  if (!d || !box) return;
  const all = d[ui.tab];
  const cols = COLS[ui.tab];
  const q = ui.q.trim().toLowerCase();

  let rows = all.filter((x) => !q || cols.some((c) => String(x[c.key]).toLowerCase().includes(q)));
  const sortCol = cols.find((c) => c.key === ui.sort.key);
  if (sortCol) {
    rows = [...rows].sort((a, b) => {
      const va = a[sortCol.key], vb = b[sortCol.key];
      const c = sortCol.num ? Number(va) - Number(vb) : String(va).localeCompare(String(vb));
      return c * ui.sort.dir;
    });
  }

  const note = $("#listNote");
  if (note) note.textContent = all.length ? `Showing ${rows.length} of ${all.length}${sortCol ? " · sorted by " + sortCol.label : ""}` : "";

  let body;
  if (all.length === 0) {
    body = h("div", { class: "empty" },
      h("div", { class: "big" }, "📭"),
      h("h3", null, `No ${ui.tab} yet`),
      `Use the form above to add the first ${SINGULAR[ui.tab]}.`);
  } else if (rows.length === 0) {
    body = h("div", { class: "empty" }, "No matches for your search.");
  } else {
    const arrow = (key) => (ui.sort.key === key ? (ui.sort.dir > 0 ? " ▲" : " ▼") : "");
    body = h("div", { class: "table-wrap" },
      h("table", null,
        h("thead", null, h("tr", null,
          h("th", null, "#"),
          cols.map((c) => h("th", { class: "sortable", title: "Sort by " + c.label, onclick: () => toggleSort(c.key) }, c.label + arrow(c.key))),
          h("th", { style: "text-align:right" }, "Actions"))),
        h("tbody", null, rows.map((x, pos) =>
          h("tr", { class: x.id === ui.editId ? "editing" : null }, [
            h("td", { class: "muted" }, String(pos + 1)),
            cols.map((c) => h("td", null,
              c.avatar ? h("span", { class: "avatar", "aria-hidden": "true" }, initials(x.name)) : null,
              c.cell ? c.cell(x) : x[c.key])),
            h("td", null, h("div", { class: "row-actions" },
              h("button", { class: "btn btn-sm", type: "button", onclick: () => startEdit(x.id) }, "Edit"),
              ui.admin ? h("button", { class: "btn btn-danger btn-sm", type: "button", onclick: () => removeItem(ui.tab, x.id) }, "Delete") : null)),
          ])))));
  }
  box.replaceChildren(body);
}

/* ---------- start ---------- */
$("#btnAdmin").addEventListener("click", adminLogin);
render();
})();
</script>
</body>
</html>
